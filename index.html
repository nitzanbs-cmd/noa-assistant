<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fake-shroom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a3e1d">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --brown:#7a3e1d; --cream:#faf6ef; --ink:#2b2118; --muted:#76695c; --green:#2f7d3b; --red:#c0392b; --amber:#e3a21a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:Arial, "Segoe UI", sans-serif; color:var(--ink); background:var(--cream); }
  #top { position:fixed; top:0; left:0; right:0; z-index:1000; display:flex; align-items:center; gap:8px;
         padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:var(--brown); color:#fff; }
  #top h1 { font-size:17px; margin:0; flex:1; }
  #top button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:6px 10px; font-size:14px; }
  #net { font-size:12px; padding:3px 8px; border-radius:10px; background:rgba(255,255,255,.18); white-space:nowrap; }
  #map { position:fixed; top:0; left:0; right:0; bottom:0; }
  #panel { position:fixed; left:0; right:0; bottom:0; z-index:1000; background:#fff; border-radius:16px 16px 0 0;
           box-shadow:0 -4px 18px rgba(0,0,0,.18); max-height:50vh; overflow:auto; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); }
  .site { border-bottom:1px solid #eee; padding:10px 0; }
  .site b { font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .btn { border:0; border-radius:10px; padding:11px 14px; font-size:15px; font-weight:bold; background:#eee; color:var(--ink); }
  .btn.main { background:var(--brown); color:#fff; }
  .btn.ok { background:var(--green); color:#fff; flex:2; font-size:18px; padding:14px; }
  .btn.warn { background:#fbe9e7; color:var(--red); }
  .btn:disabled { opacity:.45; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; background:#f3e3d3; color:var(--brown); margin-inline-start:6px; }
  .task-head { display:flex; justify-content:space-between; align-items:baseline; color:var(--muted); font-size:13px; }
  .cellbig { font-size:44px; font-weight:bold; color:var(--brown); line-height:1; }
  .what { font-size:19px; font-weight:bold; margin:6px 0 2px; }
  .uid { font-weight:bold; unicode-bidi:isolate; background:#f4f0ea; padding:1px 6px; border-radius:6px; }
  .taskgrid { display:flex; gap:12px; align-items:center; margin-top:8px; }
  .where { font-size:15px; line-height:1.5; }
  .nav { margin-top:6px; padding:8px 10px; border-radius:10px; background:#f4f0ea; font-size:15px; }
  .nav.here { background:#e3f2e5; color:var(--green); font-weight:bold; }
  #alarm { display:none; position:fixed; top:calc(52px + env(safe-area-inset-top)); left:10px; right:10px; z-index:1100;
           background:var(--red); color:#fff; font-weight:bold; text-align:center; padding:12px; border-radius:12px; font-size:17px; }
  #toast { display:none; position:fixed; top:calc(56px + env(safe-area-inset-top)); left:12px; right:12px; z-index:1200;
           background:#2b2118; color:#fff; padding:10px 12px; border-radius:10px; font-size:14px; text-align:center; }
  table.list { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
  table.list td { padding:7px 4px; border-bottom:1px solid #eee; }
  table.list tr.cur td { background:#fff6dc; }
  .st-placed { color:var(--green); font-weight:bold; }
  .st-problem { color:var(--red); font-weight:bold; }
  .st-skipped { color:var(--amber); font-weight:bold; }
  .cell-label { font-size:10px; font-weight:bold; color:#fff; text-shadow:0 0 3px #000, 0 0 2px #000; text-align:center; }
  .cell-label.plan { font-size:13px; color:#ffe9a8; }
  .progress { height:8px; background:#eee; border-radius:4px; overflow:hidden; margin:6px 0 2px; }
  .progress div { height:100%; background:var(--green); }
  .small { font-size:13px; color:var(--muted); }
  a.link { color:var(--brown); }
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <button id="back" style="display:none">→ חלקות</button>
  <h1 id="title">Fake-shroom</h1>
  <span id="net">…</span>
</div>
<div id="alarm"></div>
<div id="toast"></div>
<div id="panel"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbx2O0EhAHlQC0FUbGzV-_vdAFitphRZVR_yfejWcYUP1MUTbL1qVp-8Hhq3yfkb-iZc8A/exec';
var OUT_ALARM_M = 10;        // beep when the phone shows more than this outside the plot
var TILE_BUFFER_M = 150;     // offline map: plot + this buffer
var TILE_ZOOMS = [15, 16, 17, 18];
var IMAGERY = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
var params = new URLSearchParams(location.search);
var DEMO = params.get('demo') === '1';   // local test: plan read from google/Plan.gs, no saving to Google
var SIM = params.get('sim') === '1';     // tap on the map = my position
var GAS = !!(window.google && google.script && google.script.run);   // served from Apps Script (owner only): no code, no offline tiles

// ---------- small helpers ----------
function $(id) { return document.getElementById(id); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function toast(t, ms) { var el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, ms || 3500); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
var device = store('device') || uid(); store('device', device);

// metres in a local plane around a reference point
function xy(ref, ll) { var k = Math.cos(ref[0] * Math.PI / 180); return [(ll[1] - ref[1]) * 111320 * k, (ll[0] - ref[0]) * 110574]; }
function dist(a, b) { var p = xy(a, b); return Math.hypot(p[0], p[1]); }
function bearingName(from, to) {
  var p = xy(from, to); var deg = (Math.atan2(p[0], p[1]) * 180 / Math.PI + 360) % 360;
  return ['צפונה', 'צפון־מזרחה', 'מזרחה', 'דרום־מזרחה', 'דרומה', 'דרום־מערבה', 'מערבה', 'צפון־מערבה'][Math.round(deg / 45) % 8];
}
function ring(site) { return site.polygon[0]; }
function inside(site, ll) {
  var r = ring(site), x = ll[1], y = ll[0], c = false;
  for (var i = 0, j = r.length - 1; i < r.length; j = i++) {
    var yi = r[i][0], xi = r[i][1], yj = r[j][0], xj = r[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
function outsideBy(site, ll) {   // 0 inside, otherwise metres to the plot edge
  if (inside(site, ll)) return 0;
  var r = ring(site), best = Infinity, p = [0, 0];
  for (var i = 0; i < r.length - 1; i++) {
    var a = xy(ll, r[i]), b = xy(ll, r[i + 1]), dx = b[0] - a[0], dy = b[1] - a[1];
    var t = Math.max(0, Math.min(1, -(a[0] * dx + a[1] * dy) / (dx * dx + dy * dy || 1)));
    best = Math.min(best, Math.hypot(a[0] + t * dx, a[1] + t * dy));
  }
  return best;
}

// ---------- state ----------
var DATA = null, PLAN = store('plan'), SERVER = store('placed') || [];
var LOCAL = store('local') || {};        // 'site|task' -> {status, t}
var QUEUE = store('queue') || [];
var site = null, pos = null, acc = null, working = false, curTask = null, wake = null, audio = null, lastBeep = 0;
var placer = store('placer') || '';

function statusOf(s, task) {
  var key = s + '|' + task, l = LOCAL[key], best = l ? { status: l.status, t: l.t } : null;
  SERVER.forEach(function (p) { if (String(p.site) === String(s) && Number(p.task) === Number(task) && (!best || p.t > best.t)) best = p; });
  return best ? best.status : '';
}
function planFor(s) { return PLAN && PLAN[String(s)] ? PLAN[String(s)] : null; }

// ---------- map ----------
var map = L.map('map', { zoomControl:false, attributionControl:true, maxZoom:21 }).setView([33.05, 35.6], 10);
L.tileLayer(IMAGERY, { maxZoom:21, maxNativeZoom:18, attribution:'Esri, Maxar' }).addTo(map);
var sitesLayer = L.layerGroup().addTo(map), gridLayer = L.layerGroup().addTo(map), labelLayer = L.layerGroup(),
    planLayer = L.layerGroup().addTo(map), meLayer = L.layerGroup().addTo(map);
map.on('zoomend', function () { if (site && map.getZoom() >= 21) labelLayer.addTo(map); else map.removeLayer(labelLayer); });
if (SIM) map.on('click', function (e) { onPos([e.latlng.lat, e.latlng.lng], 4); });

function drawSites() {
  sitesLayer.clearLayers();
  DATA.sites.forEach(function (s) {
    L.polygon(s.polygon, { color:'#ffcc33', weight:2, fillOpacity:.12 }).addTo(sitesLayer)
      .on('click', function () { openSite(s.id); });
    s.trails.forEach(function (t) { L.polyline(t, { color:'#ff8a3d', weight:3, dashArray:'6 5' }).addTo(sitesLayer); });
    L.marker(s.center, { icon: L.divIcon({ className:'', html:'<div class="cell-label" style="font-size:13px;white-space:nowrap">' + s.id + '</div>', iconSize:[30, 16] }) }).addTo(sitesLayer);
  });
}

function drawGrid(s) {
  gridLayer.clearLayers(); labelLayer.clearLayers();
  s.grid.forEach(function (c) {
    L.rectangle([c.sw, c.ne], { color:'#ffffff', weight:.7, opacity:.75, fill:false, interactive:false }).addTo(gridLayer);
    var mid = [(c.sw[0] + c.ne[0]) / 2, (c.sw[1] + c.ne[1]) / 2];
    L.marker(mid, { interactive:false, icon: L.divIcon({ className:'', html:'<div class="cell-label">' + c.l + '</div>', iconSize:[30, 14] }) }).addTo(labelLayer);
  });
}
function cellOf(s, label) { for (var i = 0; i < s.grid.length; i++) if (s.grid[i].l === label) return s.grid[i]; return null; }
function cellCenter(c) { return [(c.sw[0] + c.ne[0]) / 2, (c.sw[1] + c.ne[1]) / 2]; }

function drawPlan() {
  planLayer.clearLayers();
  var p = planFor(site.id); if (!p) return;
  var cells = {};
  p.tasks.forEach(function (t) { (cells[t.cell] = cells[t.cell] || []).push(t); });
  Object.keys(cells).forEach(function (lab) {
    var c = cellOf(site, lab); if (!c) return;
    var all = cells[lab].every(function (t) { return statusOf(site.id, t.task) === 'placed'; });
    var isCur = curTask && curTask.cell === lab;
    L.rectangle([c.sw, c.ne], { color: isCur ? '#ffd400' : all ? '#2ecc71' : '#ff7f50', weight: isCur ? 4 : 2.5,
      fillOpacity: isCur ? .35 : .18, interactive:false }).addTo(planLayer);
    L.marker(cellCenter(c), { interactive:false, icon: L.divIcon({ className:'', html:'<div class="cell-label plan">' + lab + '</div>', iconSize:[36, 16] }) }).addTo(planLayer);
  });
  if (curTask) L.circleMarker(curTask.ll, { radius:5, color:'#000', weight:1, fillColor:'#ffd400', fillOpacity:1, interactive:false }).addTo(planLayer);
}

// ---------- GPS ----------
var meMarker = null, meCircle = null, watchId = null;
function startGps() {
  if (SIM || watchId !== null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(function (p) { onPos([p.coords.latitude, p.coords.longitude], p.coords.accuracy); },
    function () { toast('אין גישה למיקום. יש לאשר מיקום לדפדפן.'); }, { enableHighAccuracy:true, maximumAge:2000, timeout:20000 });
}
function onPos(ll, a) {
  pos = ll; acc = a;
  if (!meMarker) {
    meCircle = L.circle(ll, { radius:a, color:'#3d8bfd', weight:1, fillOpacity:.12, interactive:false }).addTo(meLayer);
    meMarker = L.circleMarker(ll, { radius:7, color:'#fff', weight:2, fillColor:'#3d8bfd', fillOpacity:1, interactive:false }).addTo(meLayer);
  } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(a); }
  checkOut();
  if (site && working) renderTaskNav();
}

// ---------- alarm when leaving the plot ----------
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35].forEach(function (d) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.4, audio.currentTime + d); o.start(audio.currentTime + d); o.stop(audio.currentTime + d + .25);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}
function checkOut() {
  var el = $('alarm');
  if (!site || !working || !pos) { el.style.display = 'none'; return; }
  var d = outsideBy(site, pos);
  if (d > OUT_ALARM_M) {
    el.textContent = 'יצאת מהחלקה (' + Math.round(d) + ' מ׳ מהגבול)';
    el.style.display = 'block';
    if (Date.now() - lastBeep > 5000) { lastBeep = Date.now(); beep(); }
  } else el.style.display = 'none';
}

// ---------- Google side ----------
function api(body) {
  if (GAS) return new Promise(function (res, rej) {
    google.script.run.withSuccessHandler(function (s) { res(JSON.parse(s)); }).withFailureHandler(rej).api(JSON.stringify(body));
  });
  if (!API_URL) return Promise.reject(new Error('no API'));
  return fetch(API_URL, { method:'POST', body:JSON.stringify(body), headers:{ 'Content-Type':'text/plain;charset=utf-8' } })
    .then(function (r) { return r.json(); });
}
function setNet() {
  var n = QUEUE.length;
  $('net').textContent = DEMO ? 'הדגמה' : !navigator.onLine ? (n ? 'אין קליטה · ' + n + ' ממתינים' : 'אין קליטה') : n ? n + ' ממתינים לשליחה' : 'מחובר ✓';
}
function loadPlan(code) {
  if (DEMO) return fetch('google/Plan.gs').then(function (r) { return r.text(); }).then(function (t) {
    PLAN = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1)); store('plan', PLAN); return true; });
  return api({ action:'plan', code:code }).then(function (j) {
    if (!j.ok) { toast(j.error || 'שגיאה'); return false; }
    store('code', code); PLAN = j.plan; store('plan', PLAN); SERVER = j.placed || []; store('placed', SERVER); return true;
  });
}
var flushing = false;
function flush() {
  setNet();
  if (DEMO || flushing || !QUEUE.length || !navigator.onLine || !API_URL) return;
  flushing = true;
  var batch = QUEUE.slice(0, 50);
  api({ action:'place', code:store('code'), recs:batch }).then(function (j) {
    if (j.ok) {
      var saved = {}; j.saved.forEach(function (id) { saved[id] = 1; });
      QUEUE = QUEUE.filter(function (r) { return !saved[r.rec_id]; }); store('queue', QUEUE);
      SERVER = j.placed || SERVER; store('placed', SERVER);
      if (site) { drawPlan(); if (working) renderWork(); }
    }
  }).catch(function () {}).then(function () { flushing = false; setNet(); if (QUEUE.length) setTimeout(flush, 15000); });
}
window.addEventListener('online', flush); window.addEventListener('offline', setNet);
setInterval(flush, 30000);

// ---------- offline map ----------
function tileXY(lat, lon, z) {
  var n = Math.pow(2, z), x = Math.floor((lon + 180) / 360 * n);
  var r = lat * Math.PI / 180, y = Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
  return [x, y];
}
function downloadTiles(s, btn) {
  var r = ring(s), lat = r.map(function (p) { return p[0]; }), lon = r.map(function (p) { return p[1]; });
  var dLat = TILE_BUFFER_M / 110574, dLon = TILE_BUFFER_M / (111320 * Math.cos(s.center[0] * Math.PI / 180));
  var n0 = Math.max.apply(null, lat) + dLat, s0 = Math.min.apply(null, lat) - dLat,
      w0 = Math.min.apply(null, lon) - dLon, e0 = Math.max.apply(null, lon) + dLon;
  var urls = [];
  TILE_ZOOMS.forEach(function (z) {
    var a = tileXY(n0, w0, z), b = tileXY(s0, e0, z);
    for (var x = a[0]; x <= b[0]; x++) for (var y = a[1]; y <= b[1]; y++)
      urls.push(IMAGERY.replace('{z}', z).replace('{y}', y).replace('{x}', x));
  });
  var done = 0, fail = 0, i = 0;
  btn.disabled = true;
  function next() {
    if (i >= urls.length) return Promise.resolve();
    var u = urls[i++];
    return fetch(u, { mode:'no-cors' }).catch(function () { fail++; }).then(function () {
      done++; btn.textContent = 'מוריד ' + Math.round(100 * done / urls.length) + '%'; return next();
    });
  }
  Promise.all([next(), next(), next(), next(), next(), next()]).then(function () {
    var ok = store('tiles') || {}; ok[s.id] = { t: Date.now(), n: urls.length - fail }; store('tiles', ok);
    btn.textContent = fail ? 'הורד חלקית (' + fail + ' חסרים)' : 'המפה בטלפון ✓';
    // the plot data and plan are kept too
    fetch('data.json').catch(function () {});
  });
}

// ---------- screens ----------
function showSites() {
  site = null; working = false; curTask = null; releaseWake();
  $('back').style.display = 'none'; $('title').textContent = 'Fake-shroom'; $('alarm').style.display = 'none';
  gridLayer.clearLayers(); labelLayer.clearLayers(); planLayer.clearLayers(); map.removeLayer(labelLayer);
  var b = L.latLngBounds([]); DATA.sites.forEach(function (s) { b.extend(s.polygon[0]); });
  map.fitBounds(b, { padding:[30, 30], paddingBottomRight:[0, window.innerHeight * .45] });
  var tiles = store('tiles') || {};
  var h = '<div class="small">בחרי חלקה. אפשר גם ללחוץ עליה במפה.</div>';
  DATA.sites.forEach(function (s) {
    var p = planFor(s.id);
    var doneN = p ? p.tasks.filter(function (t) { return statusOf(s.id, t.task) === 'placed'; }).length : 0;
    h += '<div class="site"><b>' + esc(s.name) + '</b>' + (p ? '<span class="badge">' + esc(p.name) + ' · ' + doneN + '/' + p.tasks.length + '</span>' : '') +
      '<div class="meta">' + s.area_m2.toLocaleString() + ' מ״ר · ' + s.grid.filter(function (c) { return c.f; }).length + ' תאים שלמים' +
      (s.trails.length ? '' : ' · אין שביל מסומן') + (tiles[s.id] ? ' · מפה בטלפון ✓' : '') + '</div>' +
      '<div class="row"><button class="btn main" data-open="' + s.id + '">פתחי</button>' +
      '<a class="btn" style="text-decoration:none" target="_blank" href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + s.center[0] + ',' + s.center[1] + '">נווטי לשם</a>' +
      (GAS ? '' : '<button class="btn" data-tiles="' + s.id + '">' + (tiles[s.id] ? 'הורידי שוב מפה' : 'הורידי מפה לשטח') + '</button>') + '</div></div>';
  });
  h += '<div class="small" style="margin-top:10px">מציבה: <b>' + esc(placer || 'לא הוגדר') + '</b> · <a class="link" href="#" id="who">שינוי</a>' +
       (PLAN || GAS ? '' : ' · <a class="link" href="#" id="codeBtn">הזנת קוד צוות</a>') + '</div>';
  $('panel').innerHTML = h;
  $('panel').querySelectorAll('[data-open]').forEach(function (el) { el.onclick = function () { openSite(+el.getAttribute('data-open')); }; });
  $('panel').querySelectorAll('[data-tiles]').forEach(function (el) { el.onclick = function () { downloadTiles(siteById(+el.getAttribute('data-tiles')), el); }; });
  $('who').onclick = function (e) { e.preventDefault(); askName(true); showSites(); };
  if ($('codeBtn')) $('codeBtn').onclick = function (e) { e.preventDefault(); askCode(); };
}
function siteById(id) { for (var i = 0; i < DATA.sites.length; i++) if (DATA.sites[i].id === id) return DATA.sites[i]; }

function askName(force) {
  if (placer && !force) return placer;
  var n = prompt('מי מציבה? (שם)', placer || '');
  if (n) { placer = n.trim(); store('placer', placer); }
  return placer;
}
function askCode() {
  var c = prompt('קוד צוות (מקבלים מנועה או מניצן)', store('code') || '');
  if (!c) return Promise.resolve(false);
  return loadPlan(c.trim()).then(function (ok) { if (ok) toast('התוכנית נטענה ✓'); site ? renderSite() : showSites(); return ok; })
    .catch(function () { toast('אין קליטה. צריך קליטה פעם אחת כדי לטעון את התוכנית.'); });
}

function openSite(id) {
  site = siteById(id); curTask = null; working = false;
  $('back').style.display = ''; $('title').textContent = site.name;
  map.fitBounds(L.polygon(site.polygon).getBounds(), { padding:[20, 20], paddingBottomRight:[0, window.innerHeight * .4] });
  drawGrid(site); startGps();
  if (!DEMO && (GAS || store('code')) && navigator.onLine) loadPlan(store('code') || '').then(function () { if (site) { drawPlan(); working ? renderWork() : renderSite(); } }).catch(function () {});
  drawPlan(); renderSite();
}

function renderSite() {
  var p = planFor(site.id), h = '';
  if (!p) {
    h = '<div class="what">אין תוכנית הצבה לחלקה הזו</div><div class="small">הגריד מוצג על המפה. ' +
        (PLAN ? 'לחלקה הזו עדיין לא הוכנה תוכנית.' : 'כדי לראות תוכנית צריך קוד צוות.') + '</div>' +
        (PLAN ? '' : '<div class="row"><button class="btn main" id="codeBtn2">הזנת קוד צוות</button></div>');
  } else {
    var n = p.tasks.length, d = p.tasks.filter(function (t) { return statusOf(site.id, t.task) === 'placed'; }).length;
    var cells = {}; p.tasks.forEach(function (t) { cells[t.cell] = 1; });
    h = '<div class="what">' + esc(p.name) + ': ' + n + ' פסלים ב־' + Object.keys(cells).length + ' תאים</div>' +
        '<div class="progress"><div style="width:' + (100 * d / n) + '%"></div></div><div class="small">' + d + ' מתוך ' + n + ' הוצבו</div>' +
        '<div class="row"><button class="btn" id="inv" style="flex:1">📋 רשימת מלאי (' + invChecked(p) + '/' + n + ')</button></div>' +
        '<div class="row"><button class="btn ok" id="start">' + (d ? 'ממשיכות ▶' : 'התחלנו ▶') + '</button></div>' +
        '<div class="row"><button class="btn" id="list">רשימת המשימות</button></div><div id="listBox" style="display:none">' + taskList(p) + '</div>';
  }
  $('panel').innerHTML = h;
  if ($('codeBtn2')) $('codeBtn2').onclick = askCode;
  if ($('start')) $('start').onclick = startWork;
  if ($('inv')) $('inv').onclick = renderInventory;
  if ($('list')) $('list').onclick = function () { var b = $('listBox'); b.style.display = b.style.display === 'none' ? '' : 'none'; };
  bindList();
}

function taskList(p) {
  var h = '<table class="list">';
  p.tasks.forEach(function (t) {
    var st = statusOf(site.id, t.task), lab = { placed:'הוצב ✓', problem:'בעיה', skipped:'דולג' }[st] || '';
    h += '<tr data-task="' + t.task + '"' + (curTask && curTask.task === t.task ? ' class="cur"' : '') + '><td>' + t.task + '</td><td><b>' + t.cell +
         '</b></td><td>' + esc(t.type) + ' ' + esc(t.size) + '</td><td class="st-' + st + '">' + lab + '</td></tr>';
  });
  return h + '</table><div class="small">לחיצה על שורה פותחת את המשימה.</div>';
}
function bindList() {
  $('panel').querySelectorAll('tr[data-task]').forEach(function (tr) {
    tr.onclick = function () { var n = +tr.getAttribute('data-task'); curTask = planFor(site.id).tasks.filter(function (t) { return t.task === n; })[0]; if (!working) startWork(true); else { drawPlan(); renderWork(); } };
  });
}

function nextTask() {
  var p = planFor(site.id); if (!p) return null;
  var open = p.tasks.filter(function (t) { var s = statusOf(site.id, t.task); return s !== 'placed' && s !== 'problem'; });
  var fresh = open.filter(function (t) { return statusOf(site.id, t.task) !== 'skipped'; });
  return fresh[0] || open[0] || null;
}

// ---------- inventory checklist (kept on this phone) ----------
var TYPE_ORDER = ['אורניה', 'פקועה', 'אזנית', 'גושית'], SIZE_ORDER = ['קטנה', 'בינונית', 'גדולה'];
function invMap() { return store('inv_' + site.id) || {}; }
function invChecked(p) { var m = invMap(); return p.tasks.filter(function (t) { return m[t.unit_id]; }).length; }
function renderInventory() {
  var p = planFor(site.id), m = invMap();
  var units = p.tasks.slice().sort(function (a, b) {
    var ta = TYPE_ORDER.indexOf(a.type), tb = TYPE_ORDER.indexOf(b.type);
    if (ta !== tb) return ta - tb;
    var fa = a.heads > 1 ? 1 : 0, fb = b.heads > 1 ? 1 : 0;
    if (fa !== fb) return fa - fb;
    var sa = SIZE_ORDER.indexOf(a.size), sb = SIZE_ORDER.indexOf(b.size);
    return sa !== sb ? sa - sb : (a.unit_id < b.unit_id ? -1 : 1);
  });
  var n = units.length, c = invChecked(p), heads = units.reduce(function (s, t) { return s + t.heads; }, 0);
  var h = '<div class="what">📋 רשימת מלאי · ' + c + '/' + n + '</div>' +
          '<div class="small">' + n + ' פסלים, ' + heads + ' פטריות. סמני ✓ כל פסל שנמצא בתיק.</div>' +
          '<div class="progress"><div style="width:' + (100 * c / n) + '%"></div></div><table class="list">';
  var lastType = '';
  units.forEach(function (t) {
    if (t.type !== lastType) { h += '<tr><td colspan="3" style="background:#f4f0ea"><b>' + esc(t.type) + '</b></td></tr>'; lastType = t.type; }
    h += '<tr data-unit="' + esc(t.unit_id) + '" style="cursor:pointer"><td style="width:44px;font-size:24px;text-align:center">' + (m[t.unit_id] ? '✅' : '⬜') +
         '</td><td><span class="uid">' + esc(t.unit_id) + '</span></td><td>' + esc(t.size) + (t.heads > 1 ? ' · ' + t.heads + ' פטריות' : '') + '</td></tr>';
  });
  h += '</table><div class="row"><button class="btn" id="invAll">סמני הכול</button><button class="btn" id="invNone">נקי הכול</button>' +
       '<button class="btn main" id="invBack" style="flex:1">חזרה</button></div>';
  $('panel').innerHTML = h;
  $('panel').querySelectorAll('tr[data-unit]').forEach(function (tr) {
    tr.onclick = function () { var mm = invMap(), u = tr.getAttribute('data-unit'); if (mm[u]) delete mm[u]; else mm[u] = 1; store('inv_' + site.id, mm); renderInventory(); };
  });
  $('invAll').onclick = function () { var mm = {}; units.forEach(function (t) { mm[t.unit_id] = 1; }); store('inv_' + site.id, mm); renderInventory(); };
  $('invNone').onclick = function () { store('inv_' + site.id, {}); renderInventory(); };
  $('invBack').onclick = function () { working ? renderWork() : renderSite(); };
}

function startWork(keepCur) {
  var pl = planFor(site.id);
  if (pl && keepCur !== true && !working) {
    var miss = pl.tasks.length - invChecked(pl);
    if (miss > 0 && !confirm('ברשימת המלאי חסרים ' + miss + ' פסלים בלי ✓. להתחיל בכל זאת?')) return;
  }
  if (!askName()) { toast('צריך שם מציבה'); return; }
  working = true;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
  if (keepCur !== true || !curTask) curTask = nextTask();
  drawPlan(); renderWork(); checkOut();
}
function releaseWake() { if (wake) { try { wake.release(); } catch (e) {} wake = null; } }
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && working && 'wakeLock' in navigator) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
});

function cellSvg(t) {   // 5x5 m square, point measured from the south-west corner
  var s = 120, k = s / 5, x = t.east_m * k, y = s - t.north_m * k;
  return '<svg width="' + (s + 30) + '" height="' + (s + 34) + '" viewBox="-15 -18 ' + (s + 30) + ' ' + (s + 34) + '" style="flex:none">' +
    '<rect x="0" y="0" width="' + s + '" height="' + s + '" fill="#f4f0ea" stroke="#7a3e1d" stroke-width="2"/>' +
    '<line x1="0" y1="' + s + '" x2="' + x + '" y2="' + s + '" stroke="#e3a21a" stroke-width="2" stroke-dasharray="4 3"/>' +
    '<line x1="' + x + '" y1="' + s + '" x2="' + x + '" y2="' + y + '" stroke="#e3a21a" stroke-width="2" stroke-dasharray="4 3"/>' +
    '<circle cx="0" cy="' + s + '" r="6" fill="#7a3e1d"/>' +
    '<circle cx="' + x + '" cy="' + y + '" r="8" fill="#2f7d3b" stroke="#fff" stroke-width="2"/>' +
    '<text x="' + (s / 2) + '" y="-6" text-anchor="middle" font-size="12" fill="#7a3e1d">▲ צפון</text>' +
    '<text x="22" y="' + (s + 15) + '" font-size="11" fill="#7a3e1d" text-anchor="middle">פינה ד״מ</text></svg>';
}

function renderWork() {
  var p = planFor(site.id), n = p.tasks.length;
  var d = p.tasks.filter(function (t) { return statusOf(site.id, t.task) === 'placed'; }).length;
  if (!curTask) {
    $('panel').innerHTML = '<div class="what">' + (d === n ? 'סיימנו! כל ' + n + ' הפסלים הוצבו 🎉' : 'אין משימות פתוחות') + '</div>' +
      '<div class="progress"><div style="width:' + (100 * d / n) + '%"></div></div>' + taskList(p) +
      '<div class="row"><button class="btn" id="stop">סיום עבודה</button></div>';
    $('stop').onclick = function () { working = false; releaseWake(); $('alarm').style.display = 'none'; renderSite(); };
    bindList(); drawPlan(); return;
  }
  var t = curTask, st = statusOf(site.id, t.task);
  var others = p.tasks.filter(function (o) { return o.cell === t.cell; });
  $('panel').innerHTML =
    '<div class="task-head"><span>משימה ' + t.task + ' מתוך ' + n + ' · ' + esc(t.cell_kind) + (others.length > 1 ? ' (' + others.length + ' פסלים בתא)' : '') + '</span><span>' + d + '/' + n + ' הוצבו</span></div>' +
    '<div class="progress"><div style="width:' + (100 * d / n) + '%"></div></div>' +
    '<div class="taskgrid"><div><div class="small">לכי לתא</div><div class="cellbig">' + t.cell + '</div></div>' + cellSvg(t) + '</div>' +
    '<div class="what">הציבי: ' + esc(t.type) + ' ' + esc(t.size) + '</div>' +
    '<div>מזהה: <span class="uid">' + esc(t.unit_id) + '</span>' + (t.heads > 1 ? ' · ' + t.heads + ' פטריות' : '') + '</div>' +
    '<div class="where">' + t.east_m.toFixed(1) + ' מ׳ מזרחה ו־' + t.north_m.toFixed(1) + ' מ׳ צפונה מהפינה הדרום־מערבית של התא</div>' +
    '<div class="nav" id="nav">מחכה למיקום…</div>' +
    (st ? '<div class="small" style="margin-top:4px">סטטוס נוכחי: ' + ({ placed:'הוצב', problem:'בעיה', skipped:'דולג' }[st] || st) + '</div>' : '') +
    '<div class="row"><button class="btn ok" id="placed">הצבתי ✓</button></div>' +
    '<div class="row"><button class="btn" id="skip">דלגי</button><button class="btn warn" id="problem">בעיה</button><button class="btn" id="list">רשימה</button></div>' +
    '<div id="listBox" style="display:none">' + taskList(p) + '</div>';
  $('placed').onclick = function () { record('placed'); };
  $('skip').onclick = function () { record('skipped'); };
  $('problem').onclick = function () { var note = prompt('מה הבעיה? (נשבר, חסר, אין מקום…)'); if (note !== null) record('problem', note); };
  $('list').onclick = function () { var b = $('listBox'); b.style.display = b.style.display === 'none' ? '' : 'none'; };
  bindList(); renderTaskNav();
}

function renderTaskNav() {
  var el = $('nav'); if (!el || !curTask) return;
  if (!pos) { el.textContent = SIM ? 'מצב הדגמה: לחצי על המפה כדי לקבוע מיקום' : 'מחכה למיקום…'; el.className = 'nav'; return; }
  var c = cellOf(site, curTask.cell), center = cellCenter(c), dd = dist(pos, center);
  var here = pos[0] >= c.sw[0] && pos[0] <= c.ne[0] && pos[1] >= c.sw[1] && pos[1] <= c.ne[1];
  el.className = 'nav' + (here || dd < 3 ? ' here' : '');
  el.textContent = (here || dd < 3 ? 'את בתא ' + curTask.cell + ' (לפי הטלפון)' : 'התא ' + Math.round(dd) + ' מ׳ ' + bearingName(pos, center)) +
    ' · דיוק GPS ±' + Math.round(acc || 0) + ' מ׳';
}

function record(status, note) {
  var t = curTask;
  var rec = { rec_id: device + '-' + uid(), t: Date.now(), site: site.id, task: t.task, cell: t.cell, unit_id: t.unit_id,
              type: t.type, size: t.size, heads: t.heads, status: status, lat: pos ? pos[0] : '', lon: pos ? pos[1] : '',
              acc: acc ? Math.round(acc * 10) / 10 : '', dist_cell: pos ? Math.round(dist(pos, t.ll) * 10) / 10 : '',
              placer: placer, note: note || '', device: device };
  LOCAL[site.id + '|' + t.task] = { status: status, t: rec.t }; store('local', LOCAL);
  if (status !== 'skipped') { QUEUE.push(rec); store('queue', QUEUE); }
  if (status === 'placed') {
    if (!pos) toast('נשמר בלי מיקום (אין GPS)');
    else if (rec.dist_cell > 8) toast('נשמר. שימי לב: הטלפון מראה ' + Math.round(rec.dist_cell) + ' מ׳ מהנקודה');
    else toast('נשמר ✓', 1500);
  }
  curTask = nextTask(); drawPlan(); renderWork(); flush();
}

$('back').onclick = showSites;

// ---------- start ----------
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
(window.EMBED_DATA ? Promise.resolve(window.EMBED_DATA) : fetch('data.json').then(function (r) { return r.json(); })).then(function (d) {
  DATA = d; drawSites();
  var ready = DEMO && !PLAN ? loadPlan('') : GAS ? loadPlan('').catch(function () {}) : Promise.resolve();
  ready.then(function () { showSites(); setNet(); flush(); });
}).catch(function () { $('panel').innerHTML = 'לא הצלחתי לטעון את החלקות. צריך קליטה בפתיחה הראשונה.'; });
</script>
</body>
</html>
